<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Achados e Perdidos Cósmicos</title>
    <style>
        :root {
            --bg: #050b1f;
            --panel: #0b1a3af2;
            --bd: #3fd0ff;
            --tx: #e8f4ff;
            --ac: #ff9a3c;
            --wn: #ffd166;
            --glow: 0 0 12px #3fd0ff55;
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top,0px);
            padding-bottom: env(safe-area-inset-bottom,0px);
        }
        html {
            scroll-padding-top: env(safe-area-inset-top,0px);
        }
        html.hc {
            --bg: #000;
            --panel: #000;
            --bd: #fff;
            --tx: #fff;
            --ac: #ffb000;
            --wn: #fff;
            --glow: none;
        }
        html.calm {
            --glow: none;
        }
        * {
            box-sizing: border-box;
        }
        [hidden] {
            display: none !important;
        }
        html,
        body {
            height: 100%;
            margin: 0;
        }
        body {
            background: radial-gradient(circle at 18% 22%,#12306b,transparent 42%),var(--bg);
            color: var(--tx);
            font: 16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;
        }
        html.hc body {
            background: #000;
        }
        html.calm #cv {
            filter: saturate(.6);
        }
        #app {
            position: relative;
            height: 100%;
            overflow: hidden;
        }
        #cv {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .p,
        #ap {
            background: var(--panel);
            border: 1px solid var(--bd);
            border-radius: 6px;
            box-shadow: var(--glow);
        }
        html.hc .p,
        html.hc #ap {
            border-width: 2px;
        }
        button {
            font: inherit;
            color: var(--tx);
            background: var(--panel);
            border: 1px solid var(--bd);
            border-radius: 6px;
            min-height: 44px;
            min-width: 44px;
            padding: 6px 12px;
            cursor: pointer;
        }
        button:hover {
            border-color: var(--ac);
        }
        button[disabled] {
            opacity: .45;
            cursor: default;
        }
        button[aria-pressed=true] {
            border-color: var(--ac);
            border-width: 3px;
        }
        :focus-visible {
            outline: 3px solid var(--ac);
            outline-offset: 2px;
        }
        #tl {
            position: absolute;
            top: 16px;
            left: 16px;
            max-width: min(300px,calc(100% - 32px));
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
            z-index: 3;
        }
        #bc {
            margin: 0;
            padding: 6px 10px;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            font-size: .95rem;
        }
        #bc li+li::before {
            content: ">";
            margin-right: 4px;
            opacity: .7;
        }
        #seal {
            margin: 0;
            padding: 4px 8px;
            font-size: .875rem;
            color: var(--wn);
            background: var(--panel);
            border-radius: 4px;
        }
        #hub {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            padding: 110px 16px 70px;
            overflow: auto;
        }
        h1 {
            font-size: clamp(1.3rem,4.2vw,2.3rem);
            letter-spacing: .1em;
            margin: 0;
            font-weight: 700;
        }
        #hubb {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .pl {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px;
            width: 140px;
        }
        .orb {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 2px solid var(--bd);
            animation: pu 2.6s ease-in-out infinite;
        }
        @keyframes pu {
            50% {
                transform: scale(1.07);
            }
        }
        html.calm * {
            animation: none !important;
            transition: none !important;
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
        #list {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 270px;
            max-height: 58vh;
            overflow: auto;
            padding: 10px;
            z-index: 3;
        }
        h2 {
            font-size: 1.05rem;
            margin: 0 0 6px;
        }
        #ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 6px;
        }
        #ul button {
            width: 100%;
            text-align: left;
        }
        #ul button[aria-current=true] {
            border-color: var(--ac);
            border-width: 3px;
        }
        small {
            display: block;
            opacity: .9;
            font-size: .875rem;
        }
        #card {
            position: absolute;
            left: 16px;
            top: 150px;
            width: min(360px,calc(100% - 32px));
            max-height: calc(100% - 230px);
            overflow: auto;
            padding: 14px;
            z-index: 4;
        }
        #card p {
            margin: .5em 0;
        }
        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        #bl {
            position: absolute;
            left: 16px;
            bottom: 16px;
            display: flex;
            gap: 8px;
            z-index: 5;
        }
        #ap {
            position: absolute;
            left: 0;
            bottom: 54px;
            width: 250px;
            padding: 10px;
            display: grid;
            gap: 6px;
        }
        #ap label {
            display: flex;
            gap: 8px;
            align-items: center;
            min-height: 44px;
        }
        #ft {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }
        #ft button {
            background: none;
            border: 0;
            text-decoration: underline;
            font-size: .875rem;
        }
        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }
        dialog {
            background: var(--bg);
            color: var(--tx);
            border: 2px solid var(--bd);
            border-radius: 8px;
            max-width: min(580px,92vw);
            max-height: 80vh;
        }
        dialog::backdrop {
            background: #000a;
        }
        dialog a {
            color: var(--wn);
            overflow-wrap: anywhere;
        }
        dialog li {
            margin: 0 0 8px;
        }
        @media (max-width: 700px) {
            #list {
                top: auto;
                left: 0;
                right: 0;
                width: auto;
                bottom: 72px;
                max-height: 32vh;
                border-radius: 12px 12px 0 0;
            }
            #card {
                top: auto;
                left: 0;
                width: 100%;
                bottom: 72px;
                max-height: 62vh;
                border-radius: 12px 12px 0 0;
            }
            .item #list {
                display: none;
            }
            #ft {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="cv" aria-hidden="true"></canvas>
        <nav id="tl" aria-label="Navegação">
            <button id="back"><span aria-hidden="true">←</span> <span data-t="back"></span></button>
            <ol id="bc" class="p"></ol>
            <p id="seal"></p>
        </nav>
        <main id="hub">
            <h1 id="h1">Achados e Perdidos Cósmicos</h1>
            <p id="hint"></p>
            <div id="hubb"></div>
        </main>
        <aside id="list" class="p" hidden>
            <h2 id="lh"></h2>
            <ul id="ul"></ul>
        </aside>
        <article id="card" class="p" tabindex="-1" aria-labelledby="ct" hidden></article>
        <div id="bl">
            <button id="lp" aria-pressed="false">PT</button>
            <button id="le" aria-pressed="false">EN</button>
            <button id="ab" aria-expanded="false" aria-controls="ap" data-t="acc"></button>
            <div id="ap" hidden>
                <label><input type="checkbox" id="chc"> <span data-t="hc"></span></label>
                <label><input type="checkbox" id="cca"> <span data-t="calm"></span></label>
                <button id="ad" data-t="about"></button>
            </div>
        </div>
        <div id="ft"><button id="fd" data-t="about"></button></div>
        <div id="live" class="sr" role="status" aria-live="polite"></div>
    </div>
    <dialog id="dlg" aria-labelledby="dt">
        <h2 id="dt"></h2>
        <p id="dn"></p>
        <ul id="dl"></ul>
        <form method="dialog"><button id="dc"></button></form>
    </dialog>

        function cardHtml(it) {
            const d = it.corpo === "espaco", hs = g(it, "historia").replace(/(O que é:|O que descobriu:|Onde está hoje:|What it is:|What it found:|Where it is today:)/g, "<br><b>$1</b>").replace(/^<br>/, "");
            let x = `<h2 id="ct">${it.nome}</h2><small>${t().st[it.status]||it.status} · ${it.ano}</small><p>${hs}</p><p><b>${t().seen}:</b> ${g(it,"descricao_visual")}</p><p><b>${t().last}:</b> ${g(it,"ultimo_sinal")}</p>`;
            if (it.lat != null) x += `<p>${fmtC(it.lat,it.lng)}<small>${t().pos}</small></p>`;
            if (d) x += `<p><b>${t().dist}:</b> ${nf(it.distancia_ua.toFixed(1))} UA (${it.data_distancia}) · ${t().sig} ${nf(Math.round(it.distancia_ua*8.317/60))} h</p>`;
            return x + `<div class="row"><button id="ls">${t().listen}</button><button id="cl">${t().close}</button></div>`
        }
        const up = () => { location.hash = cur.id ? "#" + cur.b : "" };
        function render(quiet) {
            const [b, id] = location.hash.slice(1).split("/"), it = ITEMS.find(i => i.id === id && i.corpo === b);
            const nb = BODIES.includes(b) ? b : "", ni = it ? id : "";
            const prev = { ...cur };
            cur = { b: nb, id: ni };
            const tt = t(), A = $("#app");
            document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
            document.querySelectorAll("[data-t]").forEach(e => e.textContent = tt[e.dataset.t]);
            $("#h1").lang = "pt-BR";
            $("#lp").setAttribute("aria-pressed", lang === "pt");
            $("#le").setAttribute("aria-pressed", lang === "en");
            $("#hint").textContent = tt.hint;
            $("#hubb").innerHTML = BODIES.map(k => {
                const n = ITEMS.filter(i => i.corpo === k).length;
                return `<button class="p pl" data-b="${k}"><span class="orb" style="background:${ORB[k]}"></span><b>${tt.nm[k]}</b><small>${n} ${n===1?tt.item:tt.items}</small></button>`
            }).join("");
            $("#hub").hidden = !!nb;
            $("#list").hidden = !nb;
            A.classList.toggle("item", !!ni);
            $("#back").disabled = !nb;
            const gl = nb && nb !== "espaco", sealT = gl ? tt.globe : tt.nsc;
            $("#seal").textContent = sealT;
            $("#seal").lang = lang;
            $("#bc").innerHTML = `<li>${tt.all}</li>` + (nb ? `<li>${tt.nm[nb]}</li>` : "") + (it ? `<li>${it.nome}</li>` : "");
            if (nb) {
                $("#lh").textContent = `${tt.list}: ${tt.nm[nb]}`;
                $("#ul").innerHTML = ITEMS.filter(i => i.corpo === nb).map(i => `<li><button data-id="${i.id}"${i.id===ni?' aria-current="true"':""}>${i.nome}<small>${tt.st[i.status]||i.status} · ${i.ano}</small></button></li>`).join("")
            }
            const K = $("#card");
            K.hidden = !it;
            if (it) {
                K.lang = lang;
                K.innerHTML = cardHtml(it);
                $("#cl").onclick = up;
                const L = $("#ls");
                if (!("speechSynthesis" in window)) L.hidden = true;
                L.onclick = () => {
                    const S = speechSynthesis;
                    if (S.speaking) {
                        S.cancel();
                        return
                    }
                    const u = new SpeechSynthesisUtterance(it.nome + ". " + g(it, "historia") + " " + g(it, "descricao_visual"));
                    u.lang = lang === "pt" ? "pt-BR" : "en-US";
                    S.speak(u)
                }
            }
            if (nb !== prev.b) {
                if (nb && nb !== "espaco") {
                    cam = { lat: DV[nb][0], lng: DV[nb][1], k: 1 }
                }
                draw()
            }
            if (it && it.lat != null) fly(it.lat, it.lng, 2.4);
            else if (nb && nb !== "espaco" && (prev.id || nb !== prev.b) && !it) fly(DV[nb][0], DV[nb][1], 1);
            else draw();
            if (!quiet) {
                if (nb !== prev.b) $("#live").textContent = `${tt.scr}: ${nb?tt.nm[nb]:"Hub"}. ${nb?ITEMS.filter(i=>i.corpo===nb).length+" "+tt.items+". ":""}${sealT}`;
                if (ni && ni !== prev.id) K.focus();
                else if (!ni && prev.id && nb === prev.b) $(`#ul [data-id="${prev.id}"]`)?.focus();
                else if (!nb && prev.b) $(`#hubb [data-b="${prev.b}"]`)?.focus()
            }
        }
        $("#hubb").onclick = e => {
            const x = e.target.closest("[data-b]");
            if (x) location.hash = "#" + x.dataset.b
        };
        $("#ul").onclick = e => {
            const x = e.target.closest("[data-id]");
            if (x) location.hash = `#${cur.b}/${x.dataset.id}`
        };
        cv.onclick = e => {
            const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, p = pins.find(q => Math.hypot(q[
                0
            ] - x, q[1] - y) < 16);
            if (p) location.hash = `#${cur.b}/${p[2]}`
        };
        $("#back").onclick = up;
        document.addEventListener("keydown", e => {
            if (e.key !== "Escape" || $("#dlg").open) return;
            if (!$("#ap").hidden) {
                $("#ap").hidden = true;
                $("#ab").setAttribute("aria-expanded", "false");
                return
            }
            if ("speechSynthesis" in window) speechSynthesis.cancel();
            up()
        });
        const setLang = l => {
            lang = l;
            ls("lang", l);
            render(true)
        };
        $("#lp").onclick = () => setLang("pt");
        $("#le").onclick = () => setLang("en");
        $("#ab").onclick = () => {
            const o = $("#ap").hidden;
            $("#ap").hidden = !o;
            $("#ab").setAttribute("aria-expanded", o)
        };
        const mode = () => {
            document.documentElement.classList.toggle("hc", hc);
            document.documentElement.classList.toggle("calm", calm);
            $("#chc").checked = hc;
            $("#cca").checked = calm;
            draw()
        };
        $("#chc").onchange = e => {
            hc = e.target.checked;
            ls("hc", hc ? "1" : "0");
            mode()
        };
        $("#cca").onchange = e => {
            calm = e.target.checked;
            ls("calm", calm ? "1" : "0");
            mode()
        };
        function about() {
            const tt = t(), D = $("#dlg");
            $("#dt").textContent = tt.about;
            $("#dn").textContent = tt.note;
            $("#dc").textContent = tt.close;
            D.lang = lang;
            $("#dl").innerHTML = ITEMS.map(i => `<li><b>${i.nome}</b><br>${tt.src}: ${i.fonte.startsWith("http")?`<a href="${i.fonte}" target="_blank" rel="noopener">${i.fonte}</a>`:tt.pend}<br><small>${tt.cons}: ${i.data_consulta==="pendente"?tt.pend:i.data_consulta}</small></li>`).join("");
            D.showModal()
        }
        $("#ad").onclick = about;
        $("#fd").onclick = about;
        addEventListener("resize", draw);
        addEventListener("hashchange", () => render());
        mode();
        render();
    </script>
</body>
</html>
